name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: cargo test --all-features --locked

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Check formatting
        continue-on-error: true
        run: |
          cargo fmt --check \
            || { echo "::warning::cargo fmt found diffs — run cargo fmt and commit"; exit 1; }
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          MSRV=$(awk -F'"' '/^rust-version[[:space:]]*=/ {print $2}' Cargo.toml)
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"
      - name: Install the MSRV toolchain
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
      - name: Check all targets at the MSRV
        run: rustup run "${{ steps.msrv.outputs.version }}" cargo check --all-targets --locked
